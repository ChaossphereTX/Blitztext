name: Release

# Builds and publishes the Windows installer (unsigned — internal distribution).
# GitHub is used only as the internal build/artifact backend for the team — it is NOT referenced
# anywhere in the app. End users update from the company server (see windows/README.md): an admin
# takes BlitztextSetup.exe from the GitHub Release and places it (with latest.json) on that server.

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $v = ''
          if ('${{ github.ref_type }}' -eq 'tag') { $v = '${{ github.ref_name }}' -replace '^v', '' }
          if ($v) {
            Write-Host "Version aus Tag: $v"
            ./windows/installer/build-installer.ps1 -Version $v
          } else {
            ./windows/installer/build-installer.ps1
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlitztextSetup
          path: windows/installer/Output/BlitztextSetup.exe
          if-no-files-found: error

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: windows/installer/Output/BlitztextSetup.exe
          generate_release_notes: true
          body: |
            Interner Build. **Nicht** direkt an Endnutzer verteilen, ohne `latest.json` auf dem
            Firmen-Server zu aktualisieren — die App aktualisiert sich ausschließlich von dort.

            Schritt zum Veröffentlichen:
            1. `BlitztextSetup.exe` aus diesem Release auf den Firmen-Server laden.
            2. Dort `latest.json` aktualisieren:
               `{ "version": "<diese Version>", "url": "https://<firmen-server>/BlitztextSetup.exe", "notes": "..." }`
